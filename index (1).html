<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>تخاوي</title>

<!-- Premium Arabic type: Aref Ruqaa for the logo, Tajawal for UI text -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@500;700;800&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --gold: #f7e7a0;
    --gold-deep: #cfa23a;
    --teal-deep: #0f4c46;
    --teal-black: #0b2e2a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
  }

  body {
    font-family: "Tajawal", sans-serif;
  }

  /* ---------- 1. Background ---------- */
  .screen {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow: hidden;
  }

  .background {
    position: absolute;
    inset: 0;
    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* Subtle top/bottom scrim so the UI reads clearly without dulling the art */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.35) 0%,
      rgba(0, 0, 0, 0) 20%,
      rgba(0, 0, 0, 0) 60%,
      rgba(0, 0, 0, 0.5) 100%
    );
    pointer-events: none;
  }

  /* ---------- Foreground content, safe-area aware ---------- */
  .content {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
  }

  /* ---------- 2. Header / Logo ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }

  .logo {
    font-family: "Aref Ruqaa", serif;
    font-weight: 700;
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1;
    margin: 0;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.45));
  }

  .logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }

  .logo-badge svg {
    width: 18px;
    height: 18px;
    stroke: var(--gold);
  }

  /* ---------- Spacer pushes buttons to the lower third ---------- */
  .spacer {
    flex: 1;
  }

  /* ---------- 3 & 4. Action buttons ---------- */
  .actions {
    display: flex;
    flex-direction: row;
    gap: 16px;
  }

  .action-btn {
    flex: 1;
    height: 128px;
    border-radius: 24px;
    border: 1.2px solid rgba(207, 162, 58, 0.55); /* gold border */
    background: linear-gradient(135deg, rgba(15, 76, 70, 0.55) 0%, rgba(11, 46, 42, 0.55) 100%);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    padding: 16px 8px;
    transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
    -webkit-tap-highlight-color: transparent;
  }

  .action-btn:active {
    transform: scale(0.96);
  }

  .action-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .action-btn span.label {
    font-family: "Tajawal", sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #ffffff;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  }

  .action-btn svg.icon {
    width: 30px;
    height: 30px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (prefers-reduced-motion: reduce) {
    .action-btn {
      transition: none;
    }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="background" role="img" aria-label="سيارة تسير على طريق صحراوي عند الغروب باتجاه جامعة بطراز شرقي"></div>
  <div class="scrim"></div>

  <div class="content">
    <!-- Header / Logo -->
    <header class="header">
      <h1 class="logo">تخاوي</h1>
      <span class="logo-badge">
        <!-- car icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13" />
          <path d="M3 13h18v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4z" />
          <circle cx="7.5" cy="17.5" r="1.2" />
          <circle cx="16.5" cy="17.5" r="1.2" />
        </svg>
      </span>
    </header>

    <div class="spacer"></div>

    <!-- Main action buttons -->
    <nav class="actions">
      <!-- In RTL source order, first child = right side = "To the University" -->
      <button class="action-btn" id="btn-university" type="button">
        <span class="label">إلى الجامعة</span>
        <!-- graduation cap, outline -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 3 1.5 8 12 13l10.5-5L12 3Z" />
          <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" />
          <path d="M22 8v6" />
        </svg>
      </button>

      <!-- Second child = left side = "To Home" -->
      <button class="action-btn" id="btn-home" type="button">
        <span class="label">إلى البيت</span>
        <!-- house, outline -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
        </svg>
      </button>
    </nav>
  </div>
</div>

<script>
  // Wire these up to your routing / navigation logic.
  document.getElementById('btn-university').addEventListener('click', () => {
    // TODO: navigate to the "ride to university" matching flow.
    console.log('إلى الجامعة');
  });

  document.getElementById('btn-home').addEventListener('click', () => {
    // TODO: navigate to the "ride to home" matching flow.
    console.log('إلى البيت');
  });
</script>

</body>
</html>
