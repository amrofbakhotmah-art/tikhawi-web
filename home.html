  /* Subtle top/bottom scrim so the UI reads clearly without dulling the art */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.35) 0%,
      rgba(0, 0, 0, 0) 20%,
      rgba(0, 0, 0, 0) 60%,
      rgba(0, 0, 0, 0.5) 100%
    );
    pointer-events: none;
  }

  /* ---------- Foreground content, safe-area aware ---------- */
  .content {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
  }

  /* ---------- 2. Header / Logo ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }

  .logo {
    font-family: "Aref Ruqaa", serif;
    font-weight: 700;
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1;
    margin: 0;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.45));
  }

  .logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }

  .logo-badge svg {
    width: 18px;
    height: 18px;
    stroke: var(--gold);
  }

  /* ---------- Spacer pushes buttons to the lower third ---------- */
  .spacer {
    flex: 1;
  }

  /* ---------- 3 & 4. Action buttons ---------- */
  .actions {
    display: flex;
    flex-direction: row;
    gap: 16px;
  }

  .action-btn {
    flex: 1;
    height: 128px;
    border-radius: 24px;
